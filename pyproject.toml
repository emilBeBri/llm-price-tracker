[project]
name = "llm-price-tracker"
version = "0.0.1"
description = "Track published LLM prices across vendor pages and cross-check them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.5.2",
    "pydantic>=2.9.1",
    "python-dotenv>=1.0.1",
    "rich>=13.0.0",
    "typer>=0.16.0",
]

# Scraping deps are OPTIONAL on purpose. A consumer that only wants prices
# imports llm_price_tracker (pure, offline) and should not inherit an HTTP
# client and an HTML parser to do it. Only the CLI's fetch commands need these:
#   uv sync --extra fetch
[project.optional-dependencies]
fetch = [
    "httpx>=0.27.0",
    "selectolax>=0.3.21",
]


# [tool.uv.sources]

# Subcommands (dev, start, etc.) are handled by Typer, not here
# [project.scripts]
# dev = "llm_price_tracker.main:dev"
# start = "llm_price_tracker.main:prod"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [dependency-groups]



[project.scripts]
llm-price-tracker = "llm_price_tracker.main:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-random-order>=1.1.1",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=6.0.0",
    "freezegun>=1.5.1",
]
extras = [
]



[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--random-order -n auto --cov=llm_price_tracker --cov-report=term-missing --cov-report=html"



[tool.ruff.lint]
extend-ignore = [
     "B008",  # Typer/FastAPI defaults
     "F541",  # f-string without any placeholders
     # "F401",  # Unused import
    "E701", # Multiple statements on one line (colon)


 ]

 [tool.ruff.format] # #LLM
  # quote-style = "double" # #LLM
  quote-style = "single" # #LLM
